<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 116" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="559" height="115" rx="6" fill="#fff" stroke="#999"/>

  <!-- before: qi -> qrip -> qj, plus direct R4 -->
  <circle cx="40" cy="75" r="15" fill="#f3f4f6" stroke="#333"/><text x="40" y="79" text-anchor="middle">qᵢ</text>
  <circle cx="140" cy="45" r="15" fill="#fde68a" stroke="#333"/><text x="140" y="48" text-anchor="middle" font-size="9">q_rip</text>
  <circle cx="240" cy="75" r="15" fill="#f3f4f6" stroke="#333"/><text x="240" y="79" text-anchor="middle">qⱼ</text>
  <path d="M54 68 L126 51" stroke="#333" fill="none" marker-end="url(#a)"/><text x="80" y="52">R₁</text>
  <path d="M154 51 L226 68" stroke="#333" fill="none" marker-end="url(#a)"/><text x="192" y="52">R₃</text>
  <path d="M131 32 C120 6, 160 6, 149 32" stroke="#333" fill="none" marker-end="url(#a)"/><text x="160" y="14">R₂</text>
  <path d="M55 78 L225 78" stroke="#333" fill="none" marker-end="url(#a)"/><text x="140" y="93" text-anchor="middle">R₄</text>

  <text x="285" y="80" font-size="20" fill="#333">⇒</text>

  <!-- after -->
  <circle cx="335" cy="75" r="15" fill="#f3f4f6" stroke="#333"/><text x="335" y="79" text-anchor="middle">qᵢ</text>
  <circle cx="525" cy="75" r="15" fill="#f3f4f6" stroke="#333"/><text x="525" y="79" text-anchor="middle">qⱼ</text>
  <path d="M350 75 L510 75" stroke="#333" fill="none" marker-end="url(#a)"/>
  <text x="430" y="66" text-anchor="middle" font-weight="bold">(R₁)(R₂)*(R₃) ∪ (R₄)</text>
  <text x="430" y="102" text-anchor="middle" direction="rtl" fill="#555">‏חוזרים על כך לכל זוג (qᵢ, qⱼ); חץ חסר = ∅</text>
</svg>
